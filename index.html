<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoBro Logbook</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects the compiled script here -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- Debug helper script -->
    <script src="/debug-console.js"></script>
    
    <!-- Early logging script -->
    <script>
      // Very early logging - this runs before any modules load
      console.log('🚀 ScoBro Logbook: HTML loaded, starting early logging...');
      
      // Store early logs in localStorage as backup
      const earlyLogs = [];
      const originalLog = console.log;
      const originalError = console.error;
      const originalWarn = console.warn;
      
      console.log = function(...args) {
        const message = '[EARLY] ' + args.join(' ');
        earlyLogs.push(message);
        originalLog.apply(console, args);
      };
      
      console.error = function(...args) {
        const message = '[EARLY ERROR] ' + args.join(' ');
        earlyLogs.push(message);
        originalError.apply(console, args);
      };
      
      console.warn = function(...args) {
        const message = '[EARLY WARN] ' + args.join(' ');
        earlyLogs.push(message);
        originalWarn.apply(console, args);
      };
      
      // Flag to prevent infinite loops when localStorage quota is exceeded
      let localStorageQuotaExceeded = false;
      const MAX_LOG_SIZE = 50000; // ~50KB max for early logs
      const MAX_LOG_LINES = 1000; // Max number of log lines to keep
      
      // Helper function to save logs with size limit and error handling
      function saveLogsToStorage() {
        if (localStorageQuotaExceeded || earlyLogs.length === 0) {
          return;
        }
        
        try {
          const existingLogs = localStorage.getItem('scobro_early_logs') || '';
          const newLogs = earlyLogs.join('\n') + '\n';
          let combinedLogs = existingLogs + newLogs;
          
          // Limit by size
          if (combinedLogs.length > MAX_LOG_SIZE) {
            // Keep only the most recent portion
            combinedLogs = combinedLogs.slice(-MAX_LOG_SIZE);
          }
          
          // Limit by number of lines
          const lines = combinedLogs.split('\n');
          if (lines.length > MAX_LOG_LINES) {
            combinedLogs = lines.slice(-MAX_LOG_LINES).join('\n');
          }
          
          localStorage.setItem('scobro_early_logs', combinedLogs);
          earlyLogs.length = 0; // Clear the array
        } catch (error) {
          // Handle quota exceeded error
          if (error.name === 'QuotaExceededError' || error.message.includes('quota')) {
            localStorageQuotaExceeded = true;
            try {
              // Try to clear and keep only recent logs
              const lines = earlyLogs.slice(-100).join('\n'); // Keep only last 100 logs
              localStorage.setItem('scobro_early_logs', lines);
              earlyLogs.length = 0;
              originalError.call(console, '⚠️ ScoBro Logbook: LocalStorage quota exceeded. Clearing old logs.');
            } catch (clearError) {
              // If even that fails, remove the key entirely and stop logging
              try {
                localStorage.removeItem('scobro_early_logs');
              } catch (e) {
                // Ignore errors when trying to clear
              }
              originalError.call(console, '⚠️ ScoBro Logbook: LocalStorage quota exceeded. Stopping localStorage logging.');
            }
          } else {
            // Other errors - just log to console
            originalError.call(console, '⚠️ ScoBro Logbook: Failed to save logs to localStorage:', error.message);
          }
        }
      }
      
      // Save logs to localStorage every 2 seconds
      setInterval(saveLogsToStorage, 2000);
      
      // Global error handler for uncaught errors
      window.addEventListener('error', function(event) {
        // Don't log quota errors back to localStorage to prevent infinite loops
        if (event.error && (event.error.name === 'QuotaExceededError' || 
            event.error.message.includes('quota') ||
            event.message.includes('quota'))) {
          originalError.call(console, '💥 Fatal error caught: [STORAGE QUOTA EXCEEDED]');
          originalError.call(console, 'Stack:', event.error?.stack);
          return;
        }
        
        const errorMsg = `[EARLY FATAL ERROR] ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`;
        if (!localStorageQuotaExceeded) {
          earlyLogs.push(errorMsg);
        }
        originalError.call(console, '💥 Fatal error caught:', errorMsg);
        originalError.call(console, 'Stack:', event.error?.stack);
      });
      
      // Global handler for unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        // Don't log quota errors back to localStorage to prevent infinite loops
        const reasonStr = String(event.reason || '');
        if (reasonStr.includes('quota') || reasonStr.includes('QuotaExceededError')) {
          originalError.call(console, '💥 Unhandled promise rejection: [STORAGE QUOTA EXCEEDED]');
          originalError.call(console, 'Stack:', event.reason?.stack);
          return;
        }
        
        const errorMsg = `[EARLY UNHANDLED REJECTION] ${event.reason}`;
        if (!localStorageQuotaExceeded) {
          earlyLogs.push(errorMsg);
        }
        originalError.call(console, '💥 Unhandled promise rejection:', errorMsg);
        originalError.call(console, 'Stack:', event.reason?.stack);
      });
      
      console.log('✅ ScoBro Logbook: Early logging system initialized');
      console.log('🔍 ScoBro Logbook: About to load main.jsx...');
    </script>
  </body>
</html>
